name: Build release packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build'
        required: true
      upload_to_ppa:
        description: 'Upload to the PPA as well'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'ilia-maslakov/mcdev'
    outputs:
      version: ${{ steps.build.outputs.version }}

    steps:
      # No ref: the recipes are repository tooling, kept out of the archive by
      # export-ignore, and release-source.sh takes the release content from the
      # tag itself. Checking the tag out would mean older tags cannot be built.
      - uses: actions/checkout@v4
        with:
          # release-source.sh reads the tag object; prepare.sh reads every tag.
          fetch-depth: 0

      - name: Install the bootstrap tooling
        # autogen.sh inside the archive needs these; autopoint in particular is
        # a package of its own on Debian and Ubuntu, only suggested by gettext.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              autoconf automake libtool gettext autopoint

      - name: Build the release archive
        id: build
        run: |
          version="${TAG#v}"
          packaging/release-source.sh "$version" "$TAG" "dist/mc6-$version.tar.gz"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: source-archive
          path: dist/*.tar.gz
          overwrite: true

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A draft: the notes are written by hand. The archive is attached now
          # so that its download link, and its checksum, are settled.
          version="${{ steps.build.outputs.version }}"
          archive="dist/mc6-$version.tar.gz"
          notes="Release notes pending. b2: $(b2sum "$archive" | cut -d' ' -f1)"

          # A rerun, after a failure in one of the builds, must not stop here.
          if gh release view "$TAG" >/dev/null 2>&1; then
              echo "release $TAG exists: replacing the archive"
              gh release upload "$TAG" "$archive" --clobber
          else
              gh release create "$TAG" "$archive" --draft --title "$TAG" --notes "$notes"
          fi

  debian:
    needs: archive
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: Debian packages (${{ matrix.name }})
    # No fail-fast: what one distribution builds is attached to the release
    # even when the other fails, see the publish job.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian Trixie
            container: debian:trixie
            distribution: trixie
            suffix: ~debian13.1
            artifact: debian-trixie-packages
          - name: Ubuntu 26.04
            container: ubuntu:26.04
            distribution: resolute
            suffix: ~ubuntu26.04.1
            artifact: ubuntu-resolute-packages
    container: ${{ matrix.container }}
    env:
      VERSION: ${{ needs.archive.outputs.version }}
      DEBIAN_FRONTEND: noninteractive
      DEB_DISTRIBUTION: ${{ matrix.distribution }}
      DEB_VERSION_SUFFIX: ${{ matrix.suffix }}

    steps:
      - name: Install the build tooling
        # git first: without it actions/checkout downloads a tarball and
        # prepare.sh has no tags to read.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
              git ca-certificates build-essential dpkg-dev lintian

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: source-archive
          path: dist

      - name: Build the source and binary packages
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          packaging/prepare.sh "$VERSION" "dist/mc6-$VERSION.tar.gz"

          # Built from the release archive with debian/ copied in, not from the
          # checkout: that keeps the source package free of patches, since the
          # archive carries mc-version.h and no debian directory of its own.
          build=$(mktemp -d)
          cp "dist/mc6-$VERSION.tar.gz" "$build/mc6_$VERSION.orig.tar.gz"
          tar -xf "dist/mc6-$VERSION.tar.gz" -C "$build"
          cp -r debian "$build/mc6-$VERSION/"

          cd "$build/mc6-$VERSION"
          # build-dep reads debian/control directly and names a dependency it
          # cannot satisfy. mk-build-deps went through equivs, where apt simply
          # removed its stub package again and said nothing about the cause.
          apt-get build-dep -y --no-install-recommends ./

          # Not as root: the extfs helper tests print <<uid>> for a file owned
          # by the current user, and half their expected outputs assume that is
          # not uid 0. Rules-Requires-Root is no, so nothing here wants root.
          useradd -m build
          chown -R build "$build"
          su build -c "cd '$build/mc6-$VERSION' && dpkg-buildpackage -us -uc"

          cd ..
          lintian --fail-on error --profile debian ./*.changes || lintian_failed=1
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp ./*.deb ./*.dsc ./*.debian.tar.* ./*.changes "$GITHUB_WORKSPACE/out/"
          test -z "${lintian_failed:-}"

      # Also on failure: a lintian error fails the step above, and the packages
      # it produced are what one looks at to understand why.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: warn
          overwrite: true

  fedora:
    needs: archive
    runs-on: ubuntu-latest
    container: fedora:latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.archive.outputs.version }}

    steps:
      - name: Install the build tooling
        run: dnf install -y git rpm-build rpmlint 'dnf-command(builddep)'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: source-archive
          path: dist

      - name: Build the RPMs
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          packaging/prepare.sh "$VERSION" "dist/mc6-$VERSION.tar.gz"
          dnf builddep -y packaging/rpm/mc6.spec

          # Not as root: the extfs helper tests print <<uid>> for a file owned
          # by the current user, and half their expected outputs assume that is
          # not uid 0. rpmbuild as root is discouraged in any case.
          useradd -m build
          su build -c 'mkdir -p ~/rpmbuild/SOURCES'
          install -o build -g build "dist/mc6-$VERSION.tar.gz" /home/build/rpmbuild/SOURCES/
          install -o build -g build packaging/rpm/mc6.spec /home/build/mc6.spec
          su build -c 'rpmbuild -ba ~/mc6.spec'

          rpmlint /home/build/rpmbuild/RPMS/*/*.rpm || true
          mkdir -p out
          cp /home/build/rpmbuild/RPMS/*/*.rpm /home/build/rpmbuild/SRPMS/*.rpm out/

      - uses: actions/upload-artifact@v4
        with:
          name: fedora-packages
          path: out/*
          overwrite: true

  arch:
    needs: archive
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.archive.outputs.version }}

    steps:
      - name: Install the build tooling
        run: pacman -Syu --noconfirm git sudo

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: source-archive
          path: dist

      - name: Build the packages
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          packaging/prepare.sh "$VERSION" "dist/mc6-$VERSION.tar.gz"

          # makepkg refuses to run as root, and finds the archive next to the
          # PKGBUILD instead of downloading it. Its -s installs the dependencies
          # through sudo, so that user needs to use it without a password.
          cp "dist/mc6-$VERSION.tar.gz" packaging/arch/
          useradd -m build
          echo 'build ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/build
          chown -R build packaging/arch
          su build -c 'cd packaging/arch && makepkg -s --noconfirm'
          mkdir -p out
          cp packaging/arch/*.pkg.tar.* out/

      - uses: actions/upload-artifact@v4
        with:
          name: arch-packages
          path: out/*
          overwrite: true

  arch-install:
    needs: [archive, arch]
    runs-on: ubuntu-latest
    # The only place the two packages meet: makepkg builds each on its own and
    # never notices when both claim the same file, and pacman refuses the pair
    # when they do. A plain image rather than base-devel, so a dependency that
    # only makepkg -s had pulled in is missed here rather than papered over -
    # though whatever the base image already carries still hides.
    container: archlinux:base
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.archive.outputs.version }}
      TERM: xterm

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: arch-packages
          path: out

      - name: Install the packages the way a user would
        run: |
          pacman -Syu --noconfirm >/dev/null
          pacman -U --noconfirm \
            "out/mc6-${VERSION}-"*.pkg.tar.zst \
            "out/mc6-plugins-${VERSION}-"*.pkg.tar.zst
          # Grep rather than run and hope: without a usable TERM mc says so and
          # still exits 0, which would pass on nothing at all.
          mc --version | grep -q "v${VERSION}"
          mcedit --version | grep -q "v${VERSION}"
          test -d /usr/lib/mc/panel-plugins

  fedora-install:
    needs: [archive, fedora]
    runs-on: ubuntu-latest
    # A plain image, not the one that built the packages: a dependency the
    # build pulled in is missed here rather than papered over.
    container: fedora:latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.archive.outputs.version }}
      TERM: xterm

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fedora-packages
          path: out

      - name: Install the packages the way a user would
        run: |
          # The interpreters the extfs helpers are written with are required by
          # path, and a build that answered /usr/sbin/perl fails right here.
          dnf install -y \
            "out/mc6-${VERSION}-"*.rpm \
            "out/mc6-plugins-${VERSION}-"*.rpm
          # Grep rather than run and hope: without a usable TERM mc says so and
          # still exits 0, which would pass on nothing at all.
          mc --version | grep -q "v${VERSION}"
          mcedit --version | grep -q "v${VERSION}"
          test -d /usr/lib64/mc/panel-plugins

  debian-install:
    needs: [archive, debian]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Debian install (${{ matrix.name }})
    # Each package is installed in the distribution it was built for: the two
    # differ in the ABI they link to, so one of them passing says nothing about
    # the other.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian Trixie
            container: debian:trixie
            artifact: debian-trixie-packages
          - name: Ubuntu 26.04
            container: ubuntu:26.04
            artifact: ubuntu-resolute-packages
    container: ${{ matrix.container }}
    env:
      VERSION: ${{ needs.archive.outputs.version }}
      DEBIAN_FRONTEND: noninteractive
      TERM: xterm

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out

      - name: Install the packages the way a user would
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            "./out/mc6_${VERSION}-"*_amd64.deb \
            "./out/mc6-data_${VERSION}-"*_all.deb \
            "./out/mc6-plugins_${VERSION}-"*_amd64.deb
          mc --version | grep -q "v${VERSION}"
          mcedit --version | grep -q "v${VERSION}"
          test -d /usr/lib/mc/panel-plugins

  macos:
    needs: archive
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.archive.outputs.version }}

    # A portability check, not a package: it says whether the release still
    # builds on macOS. The archive is self contained, so nothing else is needed
    # here, not even a checkout.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source-archive
          path: dist

      - name: Install the libraries
        # The heavy optional ones, Samba and the Mongo driver, are left out:
        # their plugins are not what this check is about.
        run: brew install glib s-lang pkgconf gettext libssh2 libarchive libmagic

      - name: Build from the release archive
        run: |
          brew_prefix=$(brew --prefix)
          gettext_prefix=$(brew --prefix gettext)

          # Homebrew is not on the default search paths of the compiler, and
          # gettext is keg-only, so libintl has to be pointed at by hand.
          export CPPFLAGS="-I$brew_prefix/include -I$gettext_prefix/include"
          export LDFLAGS="-L$brew_prefix/lib -L$gettext_prefix/lib"
          export PKG_CONFIG_PATH="$brew_prefix/lib/pkgconfig:$(brew --prefix libarchive)/lib/pkgconfig"

          tar -xf "dist/mc6-$VERSION.tar.gz"
          cd "mc6-$VERSION"
          ./configure --prefix="$brew_prefix" --disable-static \
              --with-screen=slang --enable-mcterm=yes
          make -j"$(sysctl -n hw.ncpu)"

          # A runner has no TERM, and mc sets up its terminal before it gets to
          # printing a version.
          TERM=xterm ./src/mc --version

      - name: Keep the configure log of a failed build
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-config-log
          path: mc6-*/config.log
          if-no-files-found: warn
          overwrite: true

  macos-package:
    needs: [archive]
    name: macOS package (${{ matrix.name }})
    timeout-minutes: 60
    # Each architecture is built on a native runner: Homebrew libraries are
    # architecture-bound, so cross-compiling needs a universal copy of every
    # dependency, which is more machinery than a native build of the same
    # things. The artifact names end in -packages, matching the publish job.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            suffix: arm64
            runs-on: macos-latest
          - name: Intel
            suffix: x86_64
            runs-on: macos-15-intel
    runs-on: ${{ matrix.runs-on }}
    env:
      VERSION: ${{ needs.archive.outputs.version }}
      SUFFIX: ${{ matrix.suffix }}
      NAME: ${{ matrix.name }}

    # The macOS build: a .pkg installer, and a .dmg carrying it. The check job
    # above stays fast by leaving Samba and the Mongo driver out; this package
    # is what a macOS user downloads.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source-archive
          path: dist

      - name: Install the libraries
        run: brew install glib s-lang pkgconf gettext libssh2 libarchive libmagic samba mongo-c-driver

      - name: Build and stage the package
        run: |
          brew_prefix=$(brew --prefix)
          gettext_prefix=$(brew --prefix gettext)

          # Homebrew is not on the default search paths of the compiler, and
          # the keg-only formulas have to be pointed at by hand.
          export CPPFLAGS="-I$brew_prefix/include -I$gettext_prefix/include"
          export LDFLAGS="-L$brew_prefix/lib -L$gettext_prefix/lib"
          export PKG_CONFIG_PATH="$brew_prefix/lib/pkgconfig:$(brew --prefix libarchive)/lib/pkgconfig:$(brew --prefix samba)/lib/pkgconfig:$(brew --prefix mongo-c-driver)/lib/pkgconfig"

          tar -xf "dist/mc6-$VERSION.tar.gz"
          cd "mc6-$VERSION"
          # The package is built for /usr/local, and DESTDIR stages the tree:
          # pkgbuild puts stage/usr/local back at /usr/local on install.
          ./configure --prefix=/usr/local --disable-static \
              --with-screen=slang --enable-mcterm=yes
          make -j"$(sysctl -n hw.ncpu)"
          make install DESTDIR="$(pwd)/stage"

      - name: Build the .pkg and .dmg
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p out dmg

          # An unsigned installer: a release for a terminal app has no Apple
          # identity to sign with, and the package installs the same (Gatekeeper
          # warns, then lets the user through).
          pkgbuild \
            --root "mc6-$VERSION/stage" \
            --identifier "com.mcdev.mc6" \
            --version "$VERSION" \
            "out/mc6-$VERSION-$SUFFIX.pkg"

          cp "out/mc6-$VERSION-$SUFFIX.pkg" dmg/
          printf '%s\n' \
            "mc6 $VERSION — $NAME" \
            '' \
            'Double-click the .pkg and follow the installer.' \
            'It installs mc, mcedit, mcview and mcdiff under /usr/local.' \
            > dmg/README.txt
          hdiutil create \
            -volname "mc6-$VERSION-$SUFFIX" \
            -srcfolder dmg \
            -ov -format UDZO \
            "out/mc6-$VERSION-$SUFFIX.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.suffix }}-packages
          path: out/*
          overwrite: true

  ppa:
    needs: archive
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Set PPA_SERIES to switch this on, as a space separated list of series
    # with their Ubuntu versions: "resolute:26.04 noble:24.04 jammy:22.04".
    if: vars.PPA_SERIES != ''
    env:
      VERSION: ${{ needs.archive.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: source-archive
          path: dist

      - name: Install dput
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dput

      - name: Import the upload key
        env:
          PPA_GPG_KEY: ${{ secrets.PPA_GPG_KEY }}
        run: |
          test -n "$PPA_GPG_KEY" || { echo "PPA_GPG_KEY is not set" >&2; exit 1; }
          printf '%s\n' "$PPA_GPG_KEY" | gpg --batch --quiet --import
          # This key exists only to sign PPA uploads, so it is the only one here.
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')
          test -n "$key" || { echo "no secret key was imported" >&2; exit 1; }
          echo "SIGN_KEY=$key" >> "$GITHUB_ENV"

      - name: Build and upload the source packages
        env:
          PPA: ${{ vars.PPA_TARGET || 'ppa:il-smind/mc6' }}
          SERIES: ${{ vars.PPA_SERIES }}
          # A tag push publishes. A manual run is a rehearsal unless it asks to
          # publish: a PPA keeps every version it has ever accepted, so an
          # accidental upload cannot be taken back.
          REQUESTED: ${{ github.event_name != 'workflow_dispatch' || inputs.upload_to_ppa }}
        run: |
          if test "$REQUESTED" = true; then
              upload=yes
          else
              upload=no
              echo "rehearsal: building and signing, not uploading to $PPA"
          fi

          UPLOAD="$upload" packaging/ppa-source.sh \
              "$VERSION" "dist/mc6-$VERSION.tar.gz" $SERIES

      - uses: actions/upload-artifact@v4
        with:
          name: ppa-source
          path: dist/ppa/*
          overwrite: true

  publish:
    needs: [debian, fedora, arch, arch-install, fedora-install, debian-install, macos-package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Runs even when a distribution failed: what did get built is still worth
    # attaching, and rerunning the failed job afterwards adds the rest.
    if: always()

    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: packages
          pattern: '*-packages'
          merge-multiple: true

      - name: Attach the packages to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! ls packages/* >/dev/null 2>&1; then
              echo "nothing was built: nothing to attach"
              exit 0
          fi
          gh release upload "$TAG" packages/* --clobber --repo "$GITHUB_REPOSITORY"
