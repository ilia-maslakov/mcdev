[global]
   workgroup = WORKGROUP
   server string = stream sandbox
   server role = standalone server
   security = user
   map to guest = never
   disable netbios = yes
   smb ports = 445
   log level = 1
   log file = /var/log/samba/log.%m

[archives]
   path = /home/mc/archives
   valid users = mc
   read only = yes
   browseable = yes
