# One project per scenario: its own containers, network and build volume, so
# scenarios do not have to agree about anything.
name: mc-sandbox-arcmc

services:
  remote:
    build:
      context: ../..
      dockerfile: common/remote/Dockerfile.remote
    hostname: remote
    container_name: mc-arcmc-remote
    # No published ports: scenarios are meant to run side by side, and mc
    # reaches the host over the compose network anyway.  To get at it from
    # outside, add a compose override with the ports you want.

  mc:
    build:
      context: ../..
      dockerfile: scenarios/arcmc/Dockerfile.mc
    container_name: mc-arcmc-mc
    depends_on:
      - remote
    volumes:
      # the working tree, never written to
      - ../../../../..:/src:ro
      # the build lives in the volume, so nothing lands in the tree
      - work:/work
    tty: true
    stdin_open: true

volumes:
  work:
